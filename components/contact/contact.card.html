<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .wrap { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .label { width: 96px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-faint); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font-family: var(--font-body); font-weight: var(--weight-semibold); font-size: 15px; line-height: 1;
    padding: 11px 20px; color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer;
    transition: background var(--dur-base) var(--ease-standard);
  }
  .whatsapp { background: var(--color-whatsapp); }
  .whatsapp:hover { background: var(--color-whatsapp-deep); }
  .wechat { background: var(--color-wechat); }
  .wechat:hover { background: var(--color-wechat-deep); }
</style>
