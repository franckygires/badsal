<!-- @dsCard group="Components" viewport="700x220" name="Buttons" subtitle="Primary CTA, outlined secondary, ghost — three sizes" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .wrap { padding: 26px 28px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .label { width: 96px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-faint); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font-family: var(--font-body); font-weight: var(--weight-semibold); line-height: 1;
    border-radius: var(--radius-sm); cursor: pointer; letter-spacing: 0.01em;
    transition: background var(--dur-base) var(--ease-standard), border-color var(--dur-base) var(--ease-standard);
  }
  .primary { background: var(--color-primary); color: var(--color-text-invert); border: 1.5px solid var(--color-accent); }
  .primary:hover { background: var(--color-primary-deep); }
  .secondary { background: transparent; color: var(--color-primary); border: 1.5px solid var(--color-primary); }
  .secondary:hover { background: var(--color-primary-tint); }
  .ghost { background: transparent; color: var(--color-primary); border: 1.5px solid transparent; }
  .ghost:hover { background: var(--color-primary-tint); }
  .sm { padding: 8px 16px; font-size: 13px; }
  .md { padding: 12px 22px; font-size: 15px; }
  .lg { padding: 16px 30px; font-size: 16px; }
  .disabled { opacity: 0.45; cursor: not-allowed; }
  .arrow { font-size: 1.05em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <span class="label">Primary</span>
      <button class="btn primary md">Demander un devis</button>
      <button class="btn primary sm">Demander un devis</button>
      <button class="btn primary md disabled">Indisponible</button>
    </div>
    <div class="row">
      <span class="label">Secondary</span>
      <button class="btn secondary md">En savoir plus</button>
      <button class="btn secondary md">Nos produits <span class="arrow">&rarr;</span></button>
    </div>
    <div class="row">
      <span class="label">Ghost</span>
      <button class="btn ghost md">Voir le catalogue</button>
    </div>
  </div>
</body>
</html>
