<!-- @dsCard group="Components" viewport="700x180" name="Certification badge" subtitle="RCCM / IFU compliance pills — three variants" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .wrap { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: var(--radius-pill); font-size: 12.5px; line-height: 1; white-space: nowrap; border: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
  .cert { background: var(--color-primary-tint); color: var(--color-primary); }
  .gold { background: var(--color-accent-tint); color: var(--color-accent-deep); }
  .neutral { background: var(--color-surface-alt); color: var(--color-text-muted); }
  .lbl { font-weight: 600; letter-spacing: 0.04em; }
  .val { color: var(--color-text); font-weight: 500; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  svg { width: 13px; height: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <span class="pill cert">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.7 1.1 2-.2.6 1.9 1.6 1.2-.7 1.9.7 1.9-1.6 1.2-.6 1.9-2-.2L8 14.5l-1.7-1.1-2 .2-.6-1.9L2.1 10.5l.7-1.9-.7-1.9 1.6-1.2.6-1.9 2 .2L8 1.5z" fill="currentColor" opacity="0.18"/><path d="M5.6 8.1l1.6 1.6 3.3-3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lbl">RCCM</span><span class="val">RB/COT/24&nbsp;B&nbsp;12345</span>
      </span>
      <span class="pill gold">
        <span class="lbl">IFU</span><span class="val">3201&nbsp;9000&nbsp;00000</span>
      </span>
    </div>
    <div class="row">
      <span class="pill neutral"><span class="lbl">Membre CCI Bénin</span></span>
      <span class="pill cert"><span class="lbl">Export agréé</span></span>
      <span class="pill gold"><span class="lbl">Cotonou · Bénin</span></span>
    </div>
  </div>
</body>
</html>
