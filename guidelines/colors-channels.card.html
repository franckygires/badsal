<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .row { display: flex; gap: 16px; padding: 24px; }
  .sw { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 86px; padding: 12px; border-radius: var(--radius-md); color: #fff; }
  .name { font-size: 13px; font-weight: 600; }
  .hex { font-size: 11px; opacity: 0.9; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#25D366"><span class="name">WhatsApp</span><span class="hex">#25D366</span></div>
    <div class="sw" style="background:#07C160"><span class="name">WeChat</span><span class="hex">#07C160</span></div>
  </div>
</body>
</html>
