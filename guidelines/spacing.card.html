<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .wrap { padding: 26px 28px; display: flex; align-items: flex-end; gap: 18px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { background: var(--color-primary); border-radius: var(--radius-xs); }
  .t { font-size: 11px; color: var(--color-text-faint); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box" style="width:8px;height:8px"></div><span class="t">8</span></div>
    <div class="col"><div class="box" style="width:12px;height:12px"></div><span class="t">12</span></div>
    <div class="col"><div class="box" style="width:16px;height:16px"></div><span class="t">16</span></div>
    <div class="col"><div class="box" style="width:24px;height:24px"></div><span class="t">24</span></div>
    <div class="col"><div class="box" style="width:32px;height:32px"></div><span class="t">32</span></div>
    <div class="col"><div class="box" style="width:48px;height:48px"></div><span class="t">48</span></div>
    <div class="col"><div class="box" style="width:64px;height:64px"></div><span class="t">64</span></div>
  </div>
</body>
</html>
