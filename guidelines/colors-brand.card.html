<!-- @dsCard group="Colors" viewport="700x150" name="Brand colors" subtitle="Institutional green & dark gold" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .row { display: flex; gap: 0; padding: 22px; }
  .sw { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 96px; padding: 12px; border-radius: 0; }
  .sw:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
  .sw:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-size: 11px; opacity: 0.85; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
  .on-dark { color: #fff; }
  .on-light { color: var(--color-text); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw on-dark" style="background:#1B4332"><span class="name">Primary</span><span class="hex">#1B4332</span></div>
    <div class="sw on-dark" style="background:#143026"><span class="name">Primary deep</span><span class="hex">#143026</span></div>
    <div class="sw on-dark" style="background:#B8860B"><span class="name">Accent gold</span><span class="hex">#B8860B</span></div>
    <div class="sw on-dark" style="background:#936A08"><span class="name">Gold deep</span><span class="hex">#936A08</span></div>
    <div class="sw on-light" style="background:#F6EFD9"><span class="name">Gold tint</span><span class="hex">#F6EFD9</span></div>
  </div>
</body>
</html>
