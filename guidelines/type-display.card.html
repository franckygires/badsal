<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .wrap { padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .spec { font-family: var(--font-display); color: var(--color-text); line-height: 1.1; letter-spacing: -0.01em; }
  .meta { font-size: 11px; color: var(--color-text-faint); letter-spacing: 0.04em; margin-top: 4px; }
  .d { font-size: 48px; font-weight: 700; }
  .h1 { font-size: 36px; font-weight: 700; }
  .h2 { font-size: 26px; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div><div class="spec d">Badsal &amp; Fils Okikiola</div><div class="meta">Playfair Display · 700 · Display 56 / H1 40</div></div>
    <div><div class="spec h2">Import &amp; export, Cotonou</div><div class="meta">Playfair Display · 600 · H2 30 / H3 22</div></div>
  </div>
</body>
</html>
